server:
  port: 7000

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      server:
        webmvc:
          routes:
            - id: scheduling-service
              uri: lb://SCHEDULING-SERVICE
              predicates:
                - Path=/api/scheduling/**
              filters:
                - StripPrefix=2
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=2
            - id: credential-service
              uri: lb://CREDENTIAL-SERVICE
              predicates:
                - Path=/api/credentials/**
              filters:
                - StripPrefix=2
      mvc:
        routes:
          - id: scheduling-service
            uri: lb://SCHEDULING-SERVICE
            predicates:
              - Path=/api/scheduling/**
            filters:
              - StripPrefix=2
          - id: notification-service
            uri: lb://NOTIFICATION-SERVICE
            predicates:
              - Path=/api/notifications/**
            filters:
              - StripPrefix=2
          - id: credential-service
            uri: lb://CREDENTIAL-SERVICE
            predicates:
              - Path=/api/credentials/**
            filters:
              - StripPrefix=2
      routes:
        - id: scheduling-service
          uri: lb://SCHEDULING-SERVICE
          predicates:
            - Path=/api/scheduling/**
          filters:
            - StripPrefix=2
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=2
        - id: credential-service
          uri: lb://CREDENTIAL-SERVICE
          predicates:
            - Path=/api/credentials/**
          filters:
            - StripPrefix=2

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:9001/eureka}